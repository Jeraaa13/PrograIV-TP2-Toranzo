<div class="card">
  <div class="card-body">
    <div class="header">
      <div class="info-autor">
        <div class="fotoUsuario">
          <img [src]="publicacion().publicadaPor.imagenPerfil || 'avatar.png'" />
        </div>
        <div class="nombreUsuario">{{ publicacion().publicadaPor.nombreUsuario }}</div>
      </div>
      @if (publicacion().publicadaPor._id === miId()) {
        <button class="boton-eliminar" (click)="onEliminar()">
          <i class="bi bi-trash"></i>
        </button>
      }
    </div>
    <div class="texto">{{ publicacion().titulo }}</div>
    <div class="descripcion">{{ publicacion().descripcion }}</div>
    @if (publicacion().imagenUrl) {
      <img class="imagen-pub" [src]="publicacion().imagenUrl" />
    }
    <div class="botones-publicacion">
      <button class="boton-like" [class.liked]="yaDioLike()" (click)="onLike()">
        <i class="bi" [class.bi-heart-fill]="yaDioLike()" [class.bi-heart]="!yaDioLike()"></i>
        {{ publicacion().meGustas.length }}
      </button>
      <a class="boton-comentarios" [routerLink]="['/publicacion', publicacion()._id]">
        <i class="bi bi-chat"></i> {{ publicacion().cantidadComentarios }}
      </a>
    </div>
  </div>
</div>
