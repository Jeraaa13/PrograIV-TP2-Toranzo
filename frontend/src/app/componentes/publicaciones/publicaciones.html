<div class="publicaciones-container">
  <div class="form-publicacion">
    <input [(ngModel)]="titulo" placeholder="Título" />
    <textarea [(ngModel)]="descripcion" placeholder="¿Qué estás pensando?"></textarea>
    <input type="file" (change)="onFileSelected($event)" #inputFile />
    <button (click)="crear()" [disabled]="enviando">Publicar</button>
  </div>

  <div class="filtros">
    <select class="select" [(ngModel)]="ordenActual" (change)="cambiarOrden()">
      <option value="fechaPublicacion" selected>Mas recientes</option>
      <option value="cantidadMeGustas">Mas populares</option>
    </select>
  </div>

  @for (pub of publicaciones(); track pub._id) {
    <app-publicacion
      [publicacion]="pub"
      [miId]="miId"
      (darLike)="toggleLike($event)"
      (eliminar)="eliminar($event)"
    />
  }

  <div class="paginacion">
    <button (click)="paginaAnterior()" [disabled]="pagina === 0">Anterior</button>
    <span>Página {{ pagina + 1 }}</span>
    <button (click)="paginaSiguiente()" [disabled]="(pagina + 1) * limite >= total">
      Siguiente
    </button>
  </div>
</div>
